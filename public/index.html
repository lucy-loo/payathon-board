<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAYATHON 2026 · 参赛作品看板</title>
  <meta name="description" content="PAYATHON 2026 参赛作品按赛道统计与各赛道热度 Top 10，每日自动更新。" />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1677ff" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PAYATHON 看板" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PAYATHON 2026 参赛作品看板" />
  <meta property="og:title" content="PAYATHON 2026 · 参赛作品看板" />
  <meta property="og:description" content="按赛道统计与各赛道热度 Top 10，每日自动更新。" />
  <meta property="og:url" content="https://lucy-loo.github.io/payathon-board/" />
  <meta property="og:image" content="https://lucy-loo.github.io/payathon-board/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <script>
    // 提前发起数据请求：不等脚本下载/解析完成再请求，省掉一次串行等待。
    // index.json / history.json 每日更新 -> no-cache，命中 ETag 时只回 304；
    // data/daily/<日期>.json 按天归档且归档后不再变化 -> force-cache，按天粒度复用浏览器缓存。
    window.__dataBoot = (async () => {
      const getJSON = async (url, cache) => {
        const res = await fetch(url, { cache });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      };
      const index = await getJSON('./data/index.json', 'no-cache');
      const [daily, history] = await Promise.all([
        getJSON(`./data/daily/${index.latest}.json`, 'force-cache'),
        getJSON('./data/history.json', 'no-cache').catch(() => null), // 缺失时不影响主表
      ]);
      return { index, daily, history };
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="hero-bar">
        <h1>PAYATHON 2026 · 参赛作品看板</h1>
        <p class="meta">
          共 <strong id="total">—</strong> 件作品
          <span class="sep">·</span>
          <span id="range">—</span>
          <span class="sep">·</span>
          更新于 <time id="updated">—</time>
          <span class="sep">·</span>
          <a id="source-link" href="https://aipay.alipay.com/community?chinfo=huodong&view=products%2Fpayathon" target="_blank" rel="noopener">数据来源</a>
        </p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="stale" id="stale" hidden></div>
    <section class="card">
      <div class="card-head">
        <h2>按赛道分类</h2>
        <span class="hint" id="track-hint"></span>
      </div>
      <div class="table-wrap">
        <table class="track-table" id="track-table">
          <thead>
            <tr><th>赛道</th><th class="num">数量</th><th class="spark-col">趋势</th><th class="share-col">占比</th></tr>
          </thead>
          <tbody id="track-body">
            <tr><td colspan="4" class="empty">加载中…</td></tr>
          </tbody>
          <tfoot id="track-foot"></tfoot>
        </table>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>各赛道热度 Top 10</h2>
        <span class="hint">热度 = 浏览量 ×1 + 点赞 ×10 + 评论 ×10</span>
      </div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="top-list" id="top-list">
        <div class="empty">加载中…</div>
      </div>
    </section>
  </main>

  <footer class="wrap footer">
    <span>数据来自支付宝 AI 付社区公开接口，由 GitHub Actions 每日抓取生成静态页面。</span>
  </footer>

  <script src="./charts.js"></script>
  <script src="./app.js"></script>
  <script>
    // 离线支持：注册 Service Worker（相对路径，作用域跟随 GitHub Pages 子路径）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
