name: Update PAYATHON data

on:
  schedule:
    # 主触发：UTC 16:10 = 北京时间 00:10
    - cron: "10 16 * * *"
    # 兜底触发：UTC 20:40 = 北京时间 04:40
    # GitHub 的 schedule 是 best-effort，主触发可能被延迟数小时、甚至整次被跳过。
    # 这条负责补跑；若当日快照已存在，下面的守卫会直接跳过，不会重复抓取。
    - cron: "40 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 同一时刻只允许一次数据更新：后到的那次会排队等待，前一次跑完后它才启动，
# 启动时 checkout 到的是已含当日快照的最新提交，因而会被守卫判为“无需抓取”。
concurrency:
  group: payathon-data
  cancel-in-progress: false

env:
  # 赛程截止日（作品提交截止）：此日期之后不再抓取，手动触发可绕过
  PAYATHON_END_DATE: "2026-12-09"

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # 先 checkout：守卫需要读 public/data/daily/ 判断当日快照是否已存在
      - name: Checkout
        uses: actions/checkout@v7

      - name: 抓取前置检查（赛程窗口 / 当日快照 / 触发方式）
        id: gate
        run: |
          today="$(TZ=Asia/Shanghai date +%F)"
          echo "今日(北京): $today / 截止: $PAYATHON_END_DATE / 触发方式: $GITHUB_EVENT_NAME"

          # 手动触发始终抓取，便于随时补数据
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$today" > "$PAYATHON_END_DATE" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::已过赛程截止日，跳过本次抓取"
            exit 0
          fi

          # 当日快照文件名即北京日期（见 scripts/scrape.mjs 的 shanghaiDate）
          if [[ -f "public/data/daily/$today.json" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::当日快照 $today.json 已存在，跳过本次抓取"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scrape PAYATHON works (按天写入快照)
        if: steps.gate.outputs.run == 'true'
        run: node scripts/scrape.mjs

      - name: Commit updated data
        id: commit
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update payathon data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN 的 push 不会触发 deploy.yml（防递归），所以在同一次运行里直接部署
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact (public/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
