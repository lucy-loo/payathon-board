name: Update PAYATHON data

on:
  schedule:
    # 每日凌晨执行：UTC 16:10 = 北京时间次日 00:10
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: payathon-data
  cancel-in-progress: false

env:
  # 赛程截止日（作品提交截止）：此日期之后不再抓取，手动触发可绕过
  PAYATHON_END_DATE: "2026-12-09"

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: 赛程窗口检查
        id: window
        run: |
          today="$(TZ=Asia/Shanghai date +%F)"
          echo "今日(北京): $today / 截止: $PAYATHON_END_DATE"
          if [[ "$today" > "$PAYATHON_END_DATE" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::已过赛程截止日，跳过本次抓取"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Scrape PAYATHON works (按天写入快照)
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: node scripts/scrape.mjs

      - name: Commit updated data
        id: commit
        if: steps.window.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update payathon data $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN 的 push 不会触发 deploy.yml（防递归），所以在同一次运行里直接部署
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact (public/)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
